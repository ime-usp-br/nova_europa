# =============================================================================
# Nova Europa - Docker Compose único para produção e desenvolvimento
# =============================================================================
# O mesmo docker-compose.yml atende produção e desenvolvimento.
# A distinção é feita APENAS pelas variáveis de ambiente (APP_ENV, APP_DEBUG, etc.):
#   - Desenvolvimento: APP_ENV=local, APP_DEBUG=true
#   - Produção:        APP_ENV=production, APP_DEBUG=false
#
# Em desenvolvimento local, o compose interpola as variáveis do arquivo .env da raiz.
# No Portainer, defina os valores na seção "Environment variables" do Stack
# (não é necessário nem recomendado commitar o .env com segredos).
#
# A aplicação é exposta na rede externa "web" (NÃO publica portas no host);
# o proxy reverso (Nginx Proxy Manager/Traefik) roteia o tráfego para ela.
#
# Uso:
#   docker compose up -d --build
#   docker compose exec app php artisan migrate
# =============================================================================

x-app-environment: &app-environment
    # Aplicação (APP_ENV é a variável que distingue dev/prod)
    APP_ENV: "${APP_ENV:-production}"
    APP_DEBUG: "${APP_DEBUG:-false}"
    APP_KEY: "${APP_KEY:-}"
    APP_NAME: "${APP_NAME:-Nova Europa}"
    APP_URL: "${APP_URL:-http://localhost}"
    APP_LOCALE: "${APP_LOCALE:-pt_BR}"
    APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-pt_BR}"
    APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-pt_BR}"
    APP_MAINTENANCE_DRIVER: "${APP_MAINTENANCE_DRIVER:-file}"
    PHP_CLI_SERVER_WORKERS: "${PHP_CLI_SERVER_WORKERS:-4}"
    BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
    # Logging
    LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
    LOG_STACK: "${LOG_STACK:-daily}"
    LOG_DEPRECATIONS_CHANNEL: "${LOG_DEPRECATIONS_CHANNEL:-null}"
    LOG_LEVEL: "${LOG_LEVEL:-warning}"
    # Banco de dados
    DB_CONNECTION: "${DB_CONNECTION:-mysql}"
    DB_HOST: "${DB_HOST:-mysql}"
    DB_PORT: "${DB_PORT:-3306}"
    DB_DATABASE: "${DB_DATABASE:-europa}"
    DB_USERNAME: "${DB_USERNAME:-europa_user}"
    DB_PASSWORD: "${DB_PASSWORD:-secret}"
    # Cache, sessão e filas
    CACHE_STORE: "${CACHE_STORE:-database}"
    SESSION_DRIVER: "${SESSION_DRIVER:-database}"
    SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
    SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
    SESSION_PATH: "${SESSION_PATH:-/}"
    SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"
    QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
    REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
    REDIS_HOST: "${REDIS_HOST:-redis}"
    REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
    REDIS_PORT: "${REDIS_PORT:-6379}"
    # Mail
    MAIL_MAILER: "${MAIL_MAILER:-smtp}"
    MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
    MAIL_PORT: "${MAIL_PORT:-587}"
    MAIL_USERNAME: "${MAIL_USERNAME:-}"
    MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
    MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@ime.usp.br}"
    MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Nova Europa}"
    # USP Senha Única
    SENHAUNICA_KEY: "${SENHAUNICA_KEY:-}"
    SENHAUNICA_SECRET: "${SENHAUNICA_SECRET:-}"
    SENHAUNICA_CALLBACK_ID: "${SENHAUNICA_CALLBACK_ID:-}"
    # USP Replicado (banco corporativo, somente leitura)
    REPLICADO_HOST: "${REPLICADO_HOST:-}"
    REPLICADO_PORT: "${REPLICADO_PORT:-1433}"
    REPLICADO_DATABASE: "${REPLICADO_DATABASE:-replicado}"
    REPLICADO_USERNAME: "${REPLICADO_USERNAME:-}"
    REPLICADO_PASSWORD: "${REPLICADO_PASSWORD:-}"
    REPLICADO_CODUNDCLG: "${REPLICADO_CODUNDCLG:-45}"
    REPLICADO_SYBASE: "${REPLICADO_SYBASE:-true}"
    # Browsershot/Puppeteer (PDF)
    PUPPETEER_CACHE_DIR: "${PUPPETEER_CACHE_DIR:-/var/www/.cache/puppeteer}"
    NODE_BINARY_PATH: "${NODE_BINARY_PATH:-/usr/bin/node}"
    NPM_BINARY_PATH: "${NPM_BINARY_PATH:-/usr/bin/npm}"
    # Outros
    BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
    FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
    RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    WARM_CACHE: "${WARM_CACHE:-false}"

services:
    # =========================================================================
    # Aplicação (Nginx + PHP-FPM no mesmo container)
    # =========================================================================
    # Não há depends_on do MySQL bundlado: o app pode usar um banco externo
    # configurado via .env (DB_HOST, DB_USERNAME, etc.). A espera pelo banco
    # é feita pelo entrypoint do container.
    app:
        build:
            context: .
            dockerfile: docker/production/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                WWWUSER: '${WWWUSER:-1000}'
        image: 'nova-europa:${APP_VERSION:-latest}'
        container_name: nova-europa-app
        restart: unless-stopped
        environment:
            <<: *app-environment
            CONTAINER_ROLE: app
        volumes:
            - ./storage:/var/www/html/storage
        networks:
            - default
            - web

    # =========================================================================
    # Worker de filas
    # =========================================================================
    worker:
        image: 'nova-europa:${APP_VERSION:-latest}'
        container_name: nova-europa-worker
        restart: unless-stopped
        command: supervisord -c /etc/supervisor/conf.d/supervisord.worker.conf
        environment:
            <<: *app-environment
            CONTAINER_ROLE: worker
        volumes:
            - ./storage:/var/www/html/storage
        networks:
            - default


# =============================================================================
# Redes
# =============================================================================
networks:
    web:
        external: true
        name: web

# =============================================================================
# Volumes
# =============================================================================
volumes:
    mysql-data:
        driver: local
        name: nova-europa-mysql-data